[package]
name = "memory_lint"
version = "0.1.0"
edition = "2021"
description = "專案記憶庫結構與引用完整性檢查（記憶庫 v2.0；規格：.kilo/plans/1792461065184-project-memory-lessons.md §9.1）"

[lib]
name = "memory_lint"

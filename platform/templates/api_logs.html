<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>API 稽核日誌 | Flaps ERP</title>
    <link rel="stylesheet" href="/assets/design-system.css">
</head>
<body class="bg-base">
    <nav class="nav-main">
        <a href="/" class="nav-logo">Flaps ERP</a>
        <div class="nav-links">
            <a href="/#transactions">交易明細</a>
            <a href="/admin/users">使用者管理</a>
            <a href="/admin/api/catalog">API 目錄</a>
            <a href="/admin/api/logs" class="active">API 稽核</a>
            <a href="/admin/api/config">API 設定</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <div class="header-content">
                <h1>API 稽核日誌</h1>
                <p class="subtitle">所有銀行端點呼叫之追溯記錄</p>
            </div>
        </header>

        <div class="card card-border">
            <div class="card-body">
                <table class="table-minimal">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>執行者</th>
                            <th>事件類型</th>
                            <th>詳細資料</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log in logs %}
                        <tr>
                            <td><code>{{ log.performed_at }}</code></td>
                            <td>{{ log.performed_by }}</td>
                            <td><span class="badge badge-sm">{{ log.event_type }}</span></td>
                            <td class="text-muted">{{ log.summary }}</td>
                        </tr>
                        {% endfor %}
                        {% if logs.is_empty() %}
                        <tr>
                            <td colspan="4" class="text-center py-4">目前無相關稽核記錄</td>
                        </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>

[package]
name = "platform"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "platform"
crate-type = ["lib"]

[dependencies]
# Core dependencies
# tokio 僅保留實際使用之功能（原 "full" 含 process/signal/io-std 等未使用項）；
# 保留 "parking_lot"：tokio 內部同步原語改採 parking_lot（"full" 原本即含），
# 移除會使排程器鎖退化（量測：月度報表 p95 由 ~33ms 惡化至高負載下秒級）。
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "fs", "net", "sync", "time", "io-util", "parking_lot"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for AI（TLS 改用 rustls：移除 native-tls/schannel 與系統 OpenSSL 依賴）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Zero-JS web tier (ADR-0002): axum HTTP server + server-rendered templates
axum = { version = "0.7", features = ["http1", "form", "tokio", "multipart"] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
# Authentication (G-1): Argon2id password hashing (OWASP recommended params)
argon2 = { version = "0.5", features = ["std"] }
# Slice 8: CSV import parsing and file fingerprinting (traceability)
csv = "1.3"
# XLSX 匯入轉接器（全能進料門戶 V1）：純 Rust、零外部執行檔依賴（crates-io 實證：0.38.0、17.8M 下載、2026-11-02 更新）
calamine = { version = "0.38", features = ["dates"] }
# PDF 文字層匯入轉接器（V2）：純 Rust 擷取（crates-io 實證：0.12.1、7.9M 下載、2026-09-16 更新）
pdf-extract = "0.12"

sha2 = "0.10"

# Core crate dependency
auxbridge_core = { path = "../core", version = "0.2.0" }

# Unified ops console manifest (single page/registry SSOT; plan 1793033568961 §3)
console_manifest = { path = "../crates/console_manifest", version = "0.2.0" }

# PHASE-R (RAG-S2): reuse the proven embedder pool + cosine from the
# knowledge module. Path dependency — zero new external crates (kem's deps
# are a subset of platform's).
kem = { path = "../crates/kem", version = "0.2.0" }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "macros", "sqlite", "chrono"] }



# thiserror for error handling（2.x：與生態多數 crate 對齊，消除 1.x/2.x 並存）
thiserror = "2.0"
paddleocr_rs_onnx = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# DOCX 匯入轉接器（V3-C）：zip 容器讀取（word/document.xml）＋OOXML 流式解析
zip = { version = "9.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# Email 附件遞迴進料（V3-A；D-EML1）：純 Rust MIME 解析（stalwartlabs，5.4M 下載、2026-11-02）
mail-parser = "1.0"

[dev-dependencies]
# Testing
tokio-test = "0.4"
# Router oneshot testing for the API layer
tower = { version = "0.5", features = ["util"] }
# 性質測試（INV-01 金額算術；計畫 1793033761021 Q7 預授權）：
# proptest 1.12.0 已在 Cargo.lock 依賴圖內，此處引用同一鎖定版本。
proptest = "1.12"

[build-dependencies]

# Rust Analyzer configuration
[package.metadata.rust-analyzer]
all_features = true



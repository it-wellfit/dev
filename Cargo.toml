[workspace]
resolver = "2"
members = [
    "core",
    "platform",
    "web",
    "crates/console_manifest",
    "crates/flaps_bridge",
    "crates/kem",
]

# 說明：各成員自行宣告依賴（不使用 workspace 繼承），故不設 [workspace.dependencies]；
# 版本政策與授權由 deny.toml／.cargo/audit.toml 統一治理（見 ADR-0014）。

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
# 2026-11-13 量測：debuginfo 關閉（`debug = 0`）＋ `strip = "symbols"` 對 auxbridge-server.exe
# **大小無顯著影響**（34,508,800 → 34,514,432 bytes；先前 split-debuginfo="info" 亦非主因），
# 故維持「不產生 debuginfo」以簡化產物；大小主因為相依（見 QUALITY_STANDARDS §5 與
# docs/GAPS_AND_RISKS.md「二進位大小分析」）。
debug = 0
split-debuginfo = "off"
strip = "symbols"




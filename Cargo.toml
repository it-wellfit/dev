[workspace]
resolver = "2"
members = [
    "core",
    "platform",
    "web",
    "crates/console_manifest",
    "crates/flaps_bridge",
    "crates/kem",
]

# 說明：各成員自行宣告依賴（不使用 workspace 繼承），故不設 [workspace.dependencies]；
# 版本政策與授權由 deny.toml／.cargo/audit.toml 統一治理（見 ADR-0014）。

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
split-debuginfo = "info"
# 2026-11-12 精實化：移除符號表（保留行號資訊供 panic 定位）——安裝包更小。
strip = "debuginfo"




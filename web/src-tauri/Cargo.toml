[workspace]

[package]
default-run = "auxbridge-web"
name = "auxbridge-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "AuxBridge - Enterprise Auxiliary Platform"
license = "LicenseRef-Proprietary"
publish = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
# 更新鏈簽章驗證（W10）：產出 latest.json 與驗收測試皆以 minisign 實際驗簽，
# 語意對齊 tauri-plugin-updater 2.14.x（PublicKey::decode / Signature::decode / verify）。
minisign-verify = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# 僅供測試：以「與 tauri CLI 相同格式」產生測試金鑰與簽章，做 sign→feed→verify
# round-trip（不進入安裝包）。與 minisign-verify 同作者、同簽章格式。
minisign = "0.10"

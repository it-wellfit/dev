# Flexible CI/CD Pipeline — 配置驅動，動態調整
#
# 供應鏈硬化（2026-11-10）：
# - 第三方 action 一律以 commit SHA 釘版（附版本註解），避免 tag 被重新指向。
# - Rust 工具鏈版本由根目錄 rust-toolchain.toml（channel = 1.99.1）唯一決定，
#   CI 不再自訂 toolchain，確保本機與 CI 可重現一致。
# - 工具安裝一律 --locked（使用 crate 自身 Cargo.lock 的相依版本）。
# - 新增五閘中的供應鏈二閘：cargo-deny 政策檢查與 CycloneDX SBOM 產出。
name: Flexible CI/CD

on:
  push:
    branches: [ main, develop, test, release ]
  pull_request:
    branches: [ main, develop, test, release ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "develop"
        type: choice
        options: [develop, test, release, production]
      skip_tests:
        description: "Skip tests (emergency only)"
        required: false
        default: false
        type: boolean
      custom_branch:
        description: "Custom branch to build (optional)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  CONFIG_FILE: .github/config/ci-config.yml

defaults:
  run:
    shell: pwsh

jobs:
  load-config:
    name: Load Configuration
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.config.outputs.branches }}
      os_matrix: ${{ steps.config.outputs.os_matrix }}
      rust_channel: ${{ steps.config.outputs.rust_channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read config
        id: config
        run: |
          $branches = '["main","develop","test","release"]'
          $os = '["ubuntu-latest","windows-latest"]'
          $rust = "1.99.1"
          "branches=$branches" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "os_matrix=$os" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rust_channel=$rust" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  baseline:
    name: Baseline (${{ matrix.os }})
    needs: load-config
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust toolchain (rust-toolchain.toml pins 1.99.1)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (含 1.99.1)
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        if: github.event.inputs.skip_tests != 'true'
        run: cargo test --locked
      - name: Security audit (RustSec)
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Dependency policy (cargo-deny advisories/bans/licenses/sources)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      # 註：原先另以 actions/checkout 取 it-wellfit/wellfit 提供桌面套件 path 依賴；
      # 2026-11-12 精簡後桌面套件已不再依賴 Wellfit crate（孤兒依賴移除），
      # 故移除該 checkout（少一次跨 repo 流量，亦解除跨 repo 建置耦合）。
      - name: Unused dependencies (cargo-machete, all workspace members)
        run: |
          cargo install cargo-machete --locked
          # cargo-machete 不支援 --manifest-path（會報 Unrecognized argument），
          # 必須以各成員目錄為 CWD 執行。
          $members = @(
            "core",
            "platform",
            "web",
            "crates/console_manifest",
            "crates/kem",
            "crates/flaps_bridge",
            "web/src-tauri"
          )
          foreach ($m in $members) {
            Push-Location $m
            cargo machete
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { exit $code }
          }
      - name: Desktop app gates (fmt / clippy / test, Windows target only)
        if: matrix.os == 'windows-latest'
        run: |
          cargo fmt --manifest-path web/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path web/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path web/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desktop app security audit (RustSec, desktop lockfile)
        working-directory: web/src-tauri
        run: |
          cargo audit --file Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Desktop app dependency policy (cargo-deny)
        working-directory: web/src-tauri
        run: |
          cargo deny check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SBOM (CycloneDX 1.5)
        run: |
          cargo install cargo-cyclonedx --locked
          # 每個 crate 以自身目錄為 CWD 產生（cargo-cyclonedx 以 CWD 決定
          # 目前的套件；--manifest-path 從 repo 根執行會產生錯誤範圍的 SBOM）。
          $crates = @(
            @{ dir = "platform"; name = "platform" },
            @{ dir = "core"; name = "auxbridge_core" },
            @{ dir = "crates/kem"; name = "kem" },
            @{ dir = "crates/console_manifest"; name = "console_manifest" },
            @{ dir = "crates/flaps_bridge"; name = "flaps_bridge" },
            @{ dir = "web"; name = "web" },
            @{ dir = "web/src-tauri"; name = "auxbridge-web" }
          )
          foreach ($c in $crates) {
            Push-Location $c.dir
            cargo cyclonedx --format json --spec-version 1.5 --all --override-filename "$($c.name).cdx"
            if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
            Pop-Location
          }
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.os }}
          path: "**/*.cdx.json"
          if-no-files-found: error
          retention-days: 30
      - name: Memory lint gates (fmt / clippy / test)
        env:
          CARGO_TARGET_DIR: target/memlint
        run: |
          cargo fmt --manifest-path .kilo/memories/tools/memory_lint/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path .kilo/memories/tools/memory_lint/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path .kilo/memories/tools/memory_lint/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Memory lint (rules & refs integrity)
        env:
          CARGO_TARGET_DIR: target/memlint
        run: |
          cargo run --quiet --manifest-path .kilo/memories/tools/memory_lint/Cargo.toml -- --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  deploy:
    name: Deploy
    needs: baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust toolchain (rust-toolchain.toml pins 1.99.1)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (含 1.99.1)
      - name: Build release
        run: cargo build --release --locked
      - name: Deploy
        run: |
          $envName = if ($env:INPUT_ENVIRONMENT) { $env:INPUT_ENVIRONMENT } elseif ($env:GITHUB_REF -eq 'refs/heads/main') { 'production' } elseif ($env:GITHUB_REF -eq 'refs/heads/release') { 'release' } elseif ($env:GITHUB_REF -eq 'refs/heads/test') { 'test' } else { 'develop' }
          Write-Host "Deploying to $envName environment..."
    env:
      INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}

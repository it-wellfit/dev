# GitHub Actions CI/CD Pipeline for Flaps ERP
name: Flaps ERP CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, nightly]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/setup@v1
      with:
        rust-version: ${{ matrix.rust }}
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/index
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.toml') }}
    
    - name: Cache cargo target
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.toml') }}
    
    - name: Run tests
      run: |
        cargo test --all-features
        cargo test --all --no-run
        
    - name: Performance tests
      run: |
        cargo run --example performance-benchmark
        
    - name: Linting
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo fmt --check
        
    - name: Build application
      run: cargo build --release
      
    - name: Run security audit
      run: |
        cargo install cargo-audit
        cargo audit
        
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t flaps-erp:${{ github.sha }} .
        docker tag flaps-erp:${{ github.sha }} flaps-erp:latest
        
    - name: Push to registry
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push flaps-erp:${{ github.sha }}
        docker push flaps-erp:latest
        
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s-deployment.yaml
        kubectl set image deployment/flaps-erp flaps-erp=flaps-erp:${{ github.sha }}
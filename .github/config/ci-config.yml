# CI/CD 配置 — 動態驅動 GitHub Actions 工作流
# 修改此檔案即可調整 CI/CD 行為，無需修改 workflow YAML

branches:
  production: main
  integration: develop
  testing: test
  release: release
  feature_prefix: "feature/"
  fix_prefix: "fix/"
  hotfix_prefix: "hotfix/"

environments:
  develop:
    branch: develop
    deploy_on_push: true
    smoke_test: true
    full_test: false
  test:
    branch: test
    deploy_on_push: true
    smoke_test: false
    full_test: true
  release:
    branch: release
    deploy_on_push: true
    smoke_test: false
    full_test: true
    tag_prefix: "rc-"
  production:
    branch: main
    deploy_on_push: true
    smoke_test: false
    full_test: true
    require_pr: true
    require_approval: true

build:
  os: [ubuntu-latest, windows-latest]
  rust_channel: "1.99.1"   # 與根 rust-toolchain.toml（channel = 1.99.1）一致
  features: []
  profile: release

quality_gates:
  fmt: true
  clippy: true
  clippy_deny_warnings: true
  test: true
  audit: true
  deny: true          # cargo-deny：公告／版本／授權／來源政策（deny.toml 為政策 SSOT）
  sbom: true          # CycloneDX 1.5 SBOM（docs/release/sbom/）
  min_test_count: 0

deploy:
  method: native-binary
  windmill: true
  target_dir: '$LOCALAPPDATA\Temp\dev-target'

notifications:
  on_failure: true
  on_success: false

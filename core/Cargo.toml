[package]
name = "flaps_core"
version = "0.0.1"
edition = "2021"

[lib]
name = "flaps_core"
crate-type = ["lib"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Cryptographic
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
# Property-based testing (PBT): money arithmetic invariants
proptest = "1.12"

[build-dependencies]

# Rust Analyzer configuration
[package.metadata.rust-analyzer]
all_features = true

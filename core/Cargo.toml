[package]
name = "auxbridge_core"
version = "0.0.1"
edition = "2021"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "auxbridge_core"
crate-type = ["lib"]

[dependencies]
# Core dependencies
sqlx = { version = "0.9", features = ["runtime-tokio", "macros", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Cryptographic
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
# 僅測試需要 async runtime（`#[tokio::test]`）；lib 本體不含 async。
tokio = { version = "1.0", features = ["macros", "rt"] }
# Testing
tokio-test = "0.4"
# Property-based testing (PBT): money arithmetic invariants
proptest = "1.12"

[build-dependencies]

# Rust Analyzer configuration
[package.metadata.rust-analyzer]
all_features = true

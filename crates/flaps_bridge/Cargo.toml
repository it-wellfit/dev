[package]
name = "flaps_bridge"
version = "0.1.0"
edition = "2021"
description = "COM batching bridge for FlapsErp (FLAPSConsoleCOM) - T-102/T-301"
license = "UNLICENSED"

[features]
# EULA-gated: real COM transport requires vendor written policy confirmation (RSK-E1)
# Disabled by default; enable with --features real-com after OQ-F1 written response
real-com = ["windows"]

[dependencies]
thiserror = "1.0"

[dependencies.windows]
package = "windows"
version = "0.58"
optional = true
features = [
  "Win32_Foundation",
  "Win32_System_Com",
]

[dev-dependencies]

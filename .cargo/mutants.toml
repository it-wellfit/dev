# cargo-mutants configuration — flaps_core
# Mutation testing harness: engine + money >=80% mutation score target.
# Ref: docs/engineering/DEVELOPMENT_METHODOLOGY.md S8 (MT)
# Schema: cargo mutants --emit-schema config

examine_globs = ["core/src/money.rs", "core/src/ledger/engine.rs"]

# Exclude SQL-string and struct-literal mutants that require DB schema tracing
# and do not validate domain invariants (engine query methods, pragmas, DSN).
exclude_re = [
  "replace LedgerEngine::apply_pragmas",
  "replace LedgerEngine::query_transactions",
  "replace LedgerEngine::query_transaction_summaries_paged",
  "replace LedgerEngine::monthly_totals",
  "replace LedgerEngine::monthly_by_account",
]

additional_cargo_test_args = ["-p", "flaps_core", "--lib"]

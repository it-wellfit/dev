# cargo audit configuration for the Dev root workspace
# Evidence rule (GOVERNANCE_STANDARD P2/P7): every ignored advisory must carry a
# written disposition. Re-review quarterly or when the dependency graph changes.

[advisories]
ignore = [
    # rsa 0.9.10 — RUSTSEC-2023-0071 (Marvin Attack, severity 5.9 medium)
    # Introduced transitively by sqlx-mysql. This workspace enables ONLY the
    # `sqlite` feature of sqlx (root Cargo.toml / platform Cargo.toml), so
    # sqlx-mysql and rsa are NOT compiled into any artifact. No fixed upgrade
    # exists upstream. Disposition: accepted risk with zero exposure.
    # Revisit if: (a) MySQL/PostgreSQL support is added, or (b) a fixed rsa
    # release becomes available.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 (CVE-2026-119375, severity 6.8 medium, 2026-11-09)
    # libsqlite3-sys 0.37.0 (via sqlx) bundles SQLite < 3.54.0: a crafted
    # .db + mismatched-page-size -wal pair can leak uninitialized page-cache
    # memory when the victim opens both files. LOCAL attack vector only.
    # Fix requires libsqlite3-sys >= 0.39.0, but sqlx-sqlite 0.9.0 (latest
    # crates.io release) pins ">=0.30.1, <0.38.0" — no in-range fix exists.
    # 2026-11-11: `cargo update` moved libsqlite3-sys 0.30.1 -> 0.37.0 (the
    # newest version sqlx-sqlite 0.9.0 accepts); the advisory range
    # (0.6.0–0.38.2) still includes 0.37.0, so this disposition stays in force.
    # sqlx 0.8 -> 0.9 was applied this round for the audit baseline; the
    # remaining gap is upstream-bound.
    # Mitigations in place: (1) the app only opens operator-created local
    # files under data\, never untrusted .db/-wal pairs; (2) single-user
    # desktop deployment; (3) daily backup (RB/Runbook) bounds exposure.
    # Revisit if: (a) sqlx releases a version widening the range to >=0.39,
    # or (b) the app ever opens third-party-provided database files.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2024-0436 (paste 1.0.15 — crate archived by its author)
    # Transitive path: paddleocr_rs_onnx 0.2.8 -> image 0.25 (default features
    # include "avif") -> ravif 0.13 -> rav1e 0.8.1 -> paste 1.0.15.
    # Verified 2026-11-10 via crates.io: rav1e 0.8.1 is the latest release and
    # declares paste as a NON-optional normal dependency, so it cannot be
    # feature-gated away by this workspace; paddleocr_rs_onnx declares
    # `image = "0.25"` with default features, so image's "avif" feature is
    # enabled in the unified feature set.
    # Severity assessment: unmaintained (not a vulnerability). paste is a
    # compile-time macro utility used by rav1e's build path; there is no known
    # exploit, no untrusted input reaches it, and the vendored code is not
    # exposed to the application's data plane. The AV1 encoder is not invoked
    # by the OCR pipeline (text detection/recognition on PNG/JPEG input).
    # Disposition: accepted risk (no safe upgrade path available upstream).
    # Revisit if: (a) rav1e publishes a release that drops paste, (b)
    # paddleocr_rs_onnx publishes a release that pins image with
    # default-features = false, or (c) the AV1 encode path is enabled.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0192 (ttf-parser 0.25.1 — author declared the crate
    # unmaintained; suggested replacement: skrifa)
    # Transitive paths: (1) pdf-extract 0.12.1 -> lopdf 0.42.0 -> ttf-parser
    # 0.25.1 (non-optional); (2) paddleocr_rs_onnx 0.2.8 -> imageproc 0.27 ->
    # ab_glyph 0.2 -> owned_ttf_parser -> ttf-parser 0.25.1.
    # Verified 2026-11-10 via crates.io: pdf-extract 0.12.1 is the latest
    # release and pins lopdf "^0.42"; lopdf 0.47.0 (2026-11-04) replaces
    # ttf-parser with the maintained skrifa, but the caret requirement
    # excludes it, and imageproc 0.27.0 is the latest release with ab_glyph
    # (and therefore owned_ttf_parser) enabled by default.
    # Severity assessment: unmaintained (not a vulnerability). ttf-parser is a
    # read-only font-table parser used by PDF text extraction and by imageproc
    # glyph rasterisation; no advisory identifies an exploitable defect, and
    # the parser never processes operator-supplied executable content.
    # Disposition: accepted risk (no safe upgrade path available upstream).
    # Revisit if: (a) pdf-extract releases a version requiring lopdf >= 0.45,
    # (b) imageproc drops ab_glyph in favour of skrifa, or (c) a security
    # advisory is issued against ttf-parser itself.
    "RUSTSEC-2026-0192",
    # RUSTSEC-2024-0370 (proc-macro-error 1.0.4 — crate archived by its author)
    # Transitive path (desktop app workspace web/src-tauri): tauri -> gtk (Linux
    # backend) -> glib-macros -> proc-macro-error. The crate is a build-time
    # macro utility; it never links into the shipped binary.
    # Severity assessment: unmaintained, not a vulnerability. The crate is not
    # compiled at all for our only release target (windows-x86_64): the gtk
    # backend is Linux-only, so proc-macro-error is present in Cargo.lock but
    # absent from the delivered artifact.
    # Disposition: accepted risk (zero exposure in the Windows artifact).
    # Revisit if: (a) a Linux build target is added to the release pipeline,
    # (b) tauri drops the gtk backend, or (c) a maintained replacement is
    # published upstream.
    "RUSTSEC-2024-0370",
    # RUSTSEC-2024-0429 (glib 0.18 — unsound Iterator/DoubleEndedIterator impls
    # for glib::VariantStrIter)
    # Transitive path: tauri -> gtk (Linux backend) -> glib. Same scope as the
    # entry above: present in Cargo.lock, not compiled into the Windows build.
    # Severity assessment: unsound (not memory-unsafe in the advisory's sense);
    # the defect requires a caller to rely on the specific iterator semantics
    # of glib::VariantStrIter. No untrusted input reaches glib in our runtime,
    # and the crate is not part of the shipped artifact.
    # Disposition: accepted risk (zero exposure in the Windows artifact).
    # Revisit if: (a) a Linux build target is added, (b) the tauri gtk backend
    # is enabled for any build we distribute, or (c) a fixed glib release is
    # published and can be pinned.
    "RUSTSEC-2024-0429",
]
